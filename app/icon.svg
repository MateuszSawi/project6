<!--
  The tab icon. App Router picks this up from its filename alone — no link tag
  and no entry in the metadata object.

  Vector rather than a .ico so the halves stay exactly even at every size a
  browser asks for, from the 16px favicon up to a pinned tab.

  The hairline border is not decoration: the upper half of the flag is white, and
  without it the icon dissolves into the tab strip of a light-themed browser. It
  is drawn inside the edge and kept translucent, so it reads as a thin edge on
  light and disappears on dark.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <clipPath id="corners">
      <rect width="32" height="32" rx="6" />
    </clipPath>
  </defs>

  <g clip-path="url(#corners)">
    <rect width="32" height="32" fill="#ffffff" />
    <rect y="16" width="32" height="16" fill="#dc143c" />
  </g>

  <rect
    x="0.5"
    y="0.5"
    width="31"
    height="31"
    rx="5.5"
    fill="none"
    stroke="#000000"
    stroke-opacity="0.2"
  />
</svg>
