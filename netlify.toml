[build]
  command = "npm run build"
  # Static export target. Next writes the whole site here as plain files.
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

# Hashed build output — safe to cache forever.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Photographs are swapped by hand, so cache them for a day, not a year.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# A private invitation. Keep it out of search results at the header level too,
# not only in the page's own meta tag.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
